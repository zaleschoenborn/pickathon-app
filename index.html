<sc-if value="{{r.why}}" hint-placeholder-val="{{false}}">
<section style="{{wrapTop}}">
<h1 style="{{h1Page}}">Why Pickathon</h1>
<p style="margin: 8px 0 18px; max-width: 680px; font-size: 19px; color: #E6E0D3">A small festival on a farm 12 miles from Portland, where you meet the next big names before everyone else does.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px">
<sc-for list="{{why.facts}}" as="f" hint-placeholder-count="5"><span style="padding: 8px 14px; border-radius: 999px; background: #1A2017; border: 1px solid #2A3125; font-weight: 700">{{f.t}}</span></sc-for>
</div>
<section aria-label="Played here first" style="margin-top: 36px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: {{why.h2size}}; line-height: 1.08">They played here first</h2>
<p style="margin: 10px 0 0; max-width: 760px; font-size: 17px; line-height: 1.55; color: #DCD6C9">It started in 2006, our first year on Pendarvis Farm, when the Avett Brothers played the Galaxy Barn before anyone knew them. We still book artists on the way up and give them stages worth remembering. At least 44 alumni got their first Grammy nomination after playing the farm, and 20 have won since.</p>
<div style="{{why.proofGrid}}"><sc-for list="{{why.proof}}" as="a" hint-placeholder-count="4"><div style="padding: 16px; border-radius: 14px; background: #1A2017; border: 1px solid #2A3125"><div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline"><strong style="font-size: 18px">{{a.n}}</strong><span class="pkp-mono" style="flex: none; color: #9FCB8A; font-weight: 700">{{a.y}}</span></div><div style="margin-top: 4px; color: #CFC9BC; line-height: 1.45">{{a.l}}</div><sc-if value="{{a.hasM}}" hint-placeholder-val="{{true}}"><a href="{{a.mu}}" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; min-height: 40px; margin-top: 6px; color: #9FCB8A; font-weight: 700; text-decoration: none">{{a.mt}}</a></sc-if></div></sc-for></div>
<button type="button" onClick="{{goPast}}" style="margin-top: 12px; min-height: 44px; padding: 0; border: 0; background: transparent; color: #9FCB8A; font: inherit; font-weight: 700; cursor: pointer">See the alumni, then and now →</button>
</section>
<section aria-label="Legends" style="margin-top: 44px; padding-top: 32px; border-top: 1px solid #2A3125">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: {{why.h2size}}; line-height: 1.08">Legends play the woods</h2>
<p style="margin: 10px 0 0; max-width: 760px; font-size: 17px; line-height: 1.55; color: #DCD6C9">Next to the new names, we bring back the artists who built the music, still at full strength, on stages a few hundred feet from your tent.</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px"><sc-for list="{{why.legends}}" as="g" hint-placeholder-count="8"><span style="padding: 8px 14px; border-radius: 999px; background: #1A2017; border: 1px solid #2A3125"><strong>{{g.n}}</strong> <span class="pkp-mono" style="color: #9FCB8A">{{g.y}}</span></span></sc-for></div>
<p style="margin: 16px 0 0; max-width: 760px; color: #B9B3A6">The one that got away: the 2020 lineup, canceled by the pandemic, had John Prine, Sierra Ferrell, (Sandy) Alex G, Joan Shelley, Chad VanGaalen and Jaimie Branch’s Fly or Die.</p>
</section>
<sc-for list="{{why.parts}}" as="w" hint-placeholder-count="4">
<article style="{{w.row}}">
<div style="{{why.imgCol}}"><div style="{{w.imgGrid}}"><sc-for list="{{w.imgs}}" as="g" hint-placeholder-count="2"><figure style="margin: 0; position: relative"><img src="{{g.i}}" alt="{{g.alt}}" loading="lazy" style="display: block; width: 100%; aspect-ratio: {{g.ar}}; object-fit: cover; border-radius: 14px"><sc-if value="{{g.hasC}}" hint-placeholder-val="{{false}}"><figcaption style="position: absolute; left: 8px; bottom: 8px; padding: 2px 8px; border-radius: 999px; background: rgba(18,22,15,0.72); font-size: 12px; color: #E6E0D3">{{g.c}}</figcaption></sc-if></figure></sc-for></div></div>
<div style="flex: 1 1 320px; min-width: 0">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: {{why.h2size}}; line-height: 1.08">{{w.t}}</h2>
<p style="margin: 10px 0 0; font-size: 17px; line-height: 1.55; color: #DCD6C9">{{w.x}}</p>
<sc-if value="{{w.hasProof}}" hint-placeholder-val="{{true}}"><p style="margin: 10px 0 0; font-size: 15px; color: #CFC9BC"><span style="font-weight: 700; color: #F2EDE3">{{w.proofHead}}</span> {{w.proof}}</p></sc-if>
<button type="button" onClick="{{w.go}}" style="margin-top: 12px; min-height: 44px; padding: 0; border: 0; background: transparent; color: #9FCB8A; font: inherit; font-weight: 700; cursor: pointer">{{w.cta}}</button>
</div>
</article>
</sc-for>
<div style="margin: 44px 0 0; display: grid; gap: 10px; max-width: 860px">
<sc-for list="{{why.quotes}}" as="q" hint-placeholder-count="3"><blockquote style="margin: 0; padding: 10px 16px; border-left: 3px solid #9FCB8A"><p style="margin: 0; font-size: 19px">{{q.t}}</p><p style="margin: 2px 0 0; color: #B9B3A6">{{q.s}}</p></blockquote></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin: 28px 0 12px">
<button type="button" onClick="{{goTickets}}" style="min-height: 50px; padding: 0 24px; border-radius: 999px; border: 0; background: #F2B33D; color: #12160F; font: inherit; font-weight: 800; cursor: pointer">{{tixCta}}</button>
<button type="button" onClick="{{goHome}}" style="min-height: 50px; padding: 0 22px; border-radius: 999px; border: 1px solid #727D6B; background: transparent; color: #F2EDE3; font: inherit; font-weight: 700; cursor: pointer">Hear the lineup first</button>
</div>
<p style="margin: 0 0 56px; color: #B9B3A6"><button type="button" onClick="{{goAbout}}" style="padding: 0; border: 0; background: transparent; color: #9FCB8A; font: inherit; font-weight: 700; cursor: pointer">Go deeper: our story, the architecture and the press →</button></p>
</section>
</sc-if>

<sc-if value="{{r.about}}" hint-placeholder-val="{{false}}">

<nav aria-label="Chapters" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px"><sc-for list="{{about.chapters}}" as="c" hint-placeholder-count="6"><a href="#pk-ab-{{c.id}}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #4A5544; color: #F2EDE3; text-decoration: none; font-weight: 700">{{c.short}}</a></sc-for><a href="#pk-ab-press" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #4A5544; color: #F2EDE3; text-decoration: none; font-weight: 700">In the press</a></nav>

<sc-if value="{{c.hasCta}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{c.go}}" style="margin-top: 12px; min-height: 44px; padding: 0; border: 0; background: transparent; color: #9FCB8A; font: inherit; font-weight: 700; cursor: pointer">{{c.cta}}</button></sc-if>

<div style="display: grid; gap: 10px; margin-top: 16px; max-width: 900px"><sc-for list="{{about.press}}" as="q" hint-placeholder-count="6"><blockquote style="margin: 0; padding: 12px 18px; border-left: 3px solid #9FCB8A; background: #1A2017; border-radius: 0 12px 12px 0"><p style="margin: 0; font-size: 18px">“{{q.q}}”</p><p style="margin: 4px 0 0; color: #B9B3A6"><a href="{{q.u}}" target="_blank" rel="noopener" style="color: #9FCB8A; font-weight: 700; text-decoration: none">{{q.o}}</a>, {{q.y}}</p></blockquote></sc-for></div>
</article>
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin: 32px 0 56px"><button type="button" onClick="{{goTickets}}" style="min-height: 50px; padding: 0 24px; border-radius: 999px; border: 0; background: #F2B33D; color: #12160F; font: inherit; font-weight: 800; cursor: pointer">{{tixCta}}</button><button type="button" onClick="{{goPress}}" style="min-height: 50px; padding: 0 22px; border-radius: 999px; border: 1px solid #727D6B; background: transparent; color: #F2EDE3; font: inherit; font-weight: 700; cursor: pointer">Press kit</button></div>
</section>

<sc-if value="{{r.press}}" hint-placeholder-val="{{false}}">

<h1 style="{{h1Page}}">Press</h1>
<p style="margin: 6px 0 18px; color: #CFC9BC; max-width: 680px">Everything you need to write about Pickathon. For interviews, photos and credentials, write to <a href="mailto:press@pickathon.com" style="color: #9FCB8A; font-weight: 700">press@pickathon.com</a>.</p>

<sc-for list="{{press.facts}}" as="f" hint-placeholder-count="6"><div style="padding: 16px; border-radius: 14px; background: #1A2017; border: 1px solid #2A3125"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px">{{f.v}}</div><div style="margin-top: 2px; color: #CFC9BC">{{f.k}}</div></div></sc-for>

<h2 style="{{h2}}; margin-top: 36px">Photos</h2>

<sc-if value="{{r.build}}" hint-placeholder-val="{{false}}">
<section style="{{bp.heroStyle}}">
<img src="{{bp.heroImg}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
<sc-for list="{{bp.reel}}" as="rl" hint-placeholder-count="3"><img src="{{rl.i}}" alt="" class="pk-reel" style="animation: pkbreel {{bp.reelDur}} linear infinite; animation-delay: {{rl.delay}}"></sc-for>
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(18,22,15,0.45) 0%, rgba(18,22,15,0.6) 40%, rgba(18,22,15,0.94) 100%)"></div>
<div style="{{bp.heroInner}}">
<p style="margin: 0 0 10px; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #F2EDE3">{{bdEye}}</p>
<h1 style="{{bp.h1}}">What do you want Pickathon to build for you?</h1>
<p style="margin: 12px 0 0; max-width: 640px; font-size: 18px; color: #E6E0D3">For businesses, schools and community groups. Leading architects and builders design it for your site. It stands at Pickathon first, then it’s yours, and it keeps the festival’s work going.</p>
<p style="margin: 12px 0 0; max-width: 680px; padding: 10px 14px; border-radius: 12px; background: rgba(18,22,15,0.62); color: #F2EDE3; font-weight: 700">Every build helps sustain Pickathon and powers the Creative Neighborhoods mission: hand-built places, students learning the trades, and a festival that keeps going for the next generation. We aim to come in at least 10% under the open-market price.</p>
<div style="display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px"><button type="button" onClick="{{bp.watch}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 20px 0 8px; border-radius: 999px; border: 1.5px solid #F2EDE3; background: rgba(18,22,15,0.5); color: #F2EDE3; font: inherit; font-weight: 800; cursor: pointer"><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 999px; background: #F2EDE3; color: #12160F; font-size: 12px">▶</span>Watch the builds</button><button type="button" onClick="{{bp.toForm}}" style="min-height: 50px; padding: 0 24px; border-radius: 999px; border: 0; background: #F2EDE3; color: #12160F; font: inherit; font-weight: 800; cursor: pointer">Build with us</button></div>
</div>
</section>
<section style="{{wrap}}">
<h2 style="{{h2}}; margin-top: 40px">What your build carries forward</h2>
<p style="margin: 6px 0 0; max-width: 760px; color: #CFC9BC">Your budget pays for a structure you need. It also puts you inside the work that keeps Pickathon and its community here for decades.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-top: 16px">
<sc-for list="{{bp.steps}}" as="s" hint-placeholder-count="3"><div style="padding: 18px; border-radius: 16px; background: #1A2017; border: 1px solid #2A3125"><div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; color: #9FCB8A">{{s.n}}</div><div style="font-weight: 800; font-size: 18px; margin-top: 4px">{{s.t}}</div><p style="margin: 6px 0 0; color: #CFC9BC; line-height: 1.5">{{s.x}}</p></div></sc-for>
</div>
<div id="pk-build-form" style="scroll-margin-top: 90px; margin: 36px 0 8px; max-width: 900px; padding: 22px; border-radius: 20px; background: #F2EDE3; color: #12160F">
<sc-if value="{{bp.open}}" hint-placeholder-val="{{true}}">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 28px">Build with us</h2>
<p style="margin: 6px 0 16px; color: #3A4035">Need something built, or want to help build it? Let us hear from you.</p>
<div style="{{bp.doorGrid}}"><sc-for list="{{bp.doors}}" as="dr" hint-placeholder-count="4"><button type="button" onClick="{{dr.pick}}" aria-pressed="{{dr.on}}" style="{{dr.style}}"><span style="display: block; font-size: {{bp.doorFs}}; font-weight: 800; line-height: 1.2">{{dr.t}}</span><span style="{{dr.subS}}">{{dr.x}}</span></button></sc-for></div>
<p style="margin: 10px 0 0; font-size: 14px; color: #3A4035">{{bp.doorX}}</p>
<sc-if value="{{bp.hasDoor}}" hint-placeholder-val="{{true}}">
<div style="display: grid; gap: 12px; margin-top: 22px; padding-top: 20px; border-top: 1px solid #C9C2B0">
<p style="margin: 0; font-weight: 800; font-size: 18px">{{bp.dHead}}</p>
<sc-if value="{{bp.hasDeadline}}" hint-placeholder-val="{{true}}"><p style="margin: -6px 0 0; font-size: 14px; color: #3A4035">We take on a few projects a year and choose them with our design and build partners. {{bdNote}}</p></sc-if>
<div style="{{bp.twoField}}">
<label style="font-weight: 700">Full name (required)<input type="text" autocomplete="name" value="{{bp.f.name}}" onChange="{{bp.set.name}}" style="{{bp.inp}}"></label>
<label style="font-weight: 700">Email (required)<input type="email" autocomplete="email" value="{{bp.f.email}}" onChange="{{bp.set.email}}" style="{{bp.inp}}"></label>
<label style="font-weight: 700">{{bp.orgL}}<input type="text" autocomplete="organization" value="{{bp.f.org}}" onChange="{{bp.set.org}}" style="{{bp.inp}}"></label>
<label style="font-weight: 700">Phone (optional)<input type="tel" autocomplete="tel" value="{{bp.f.phone}}" onChange="{{bp.set.phone}}" style="{{bp.inp}}"></label>
</div>
<sc-if value="{{bp.hasWeb}}" hint-placeholder-val="{{true}}"><label style="font-weight: 700">{{bp.webL}}<input type="url" autocomplete="url" value="{{bp.f.web}}" onChange="{{bp.set.web}}" style="{{bp.inp}}"></label></sc-if>
<sc-for list="{{bp.qs}}" as="q" hint-placeholder-count="3"><fieldset style="border: 0; padding: 0; margin: 0"><legend style="font-weight: 700; margin-bottom: 6px">{{q.l}}</legend><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{q.o}}" as="k" hint-placeholder-count="3"><button type="button" onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="{{k.style}}">{{k.t}}</button></sc-for></div><sc-if value="{{q.hasN}}" hint-placeholder-val="{{false}}"><p style="margin: 6px 0 0; font-size: 13px; color: #3A4035">{{q.n}}</p></sc-if></fieldset></sc-for>
<label style="font-weight: 700">{{bp.whatL}}<span style="display: block; font-weight: 400; font-size: 14px; color: #3A4035; margin-top: 2px">{{bp.whatH}}</span><textarea onChange="{{bp.set.what}}" rows="4" style="{{bp.ta}}">{{bp.f.what}}</textarea></label>
<fieldset style="border: 0; padding: 0; margin: 0"><legend style="font-weight: 700; margin-bottom: 6px">How did you hear about this?</legend><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{bp.heards}}" as="k" hint-placeholder-count="3"><button type="button" onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="{{k.style}}">{{k.t}}</button></sc-for></div></fieldset>
<sc-if value="{{bp.hasErr}}" hint-placeholder-val="{{false}}"><p role="alert" style="margin: 0; color: #8A2A12; font-weight: 700">{{bp.err}}</p></sc-if>

</div>
</sc-if>
</sc-if>

</div>
<h2 style="{{h2}}; margin-top: 44px">Who we build for</h2>
<div style="{{bp.twoGrid}}; margin-top: 16px">
<sc-for list="{{bp.ways}}" as="w" hint-placeholder-count="2"><div style="border-radius: 18px; overflow: hidden; background: #1A2017; border: 1px solid #2A3125"><img src="{{w.img}}" alt="" loading="lazy" style="display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover"><div style="padding: 16px 18px 20px"><h3 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 24px">{{w.t}}</h3><p style="margin: 6px 0 0; color: #DCD6C9; line-height: 1.5">{{w.x}}</p><p style="margin: 10px 0 0; font-size: 14px; color: #B9B3A6">{{w.ex}}</p><button type="button" onClick="{{w.go}}" style="margin-top: 14px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid #F2EDE3; background: transparent; color: #F2EDE3; font: inherit; font-weight: 800; cursor: pointer">Tell us what you need ↑</button></div></div></sc-for>
</div>
<h2 style="{{h2}}; margin-top: 44px">Where the 2026 neighborhoods went</h2>
<p style="margin: 6px 0 14px; color: #CFC9BC; max-width: 680px">Most neighborhoods live at Pickathon first, then go on to a permanent home.</p>
