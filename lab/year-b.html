<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Pickathon Past (TEST)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lab.css">
<style>
.b{position:absolute;inset:0;display:flex;flex-direction:column;padding:20px 32px 20px;gap:18px}
.b .hd{flex:none;display:flex;align-items:flex-end;gap:32px}
.b .yr{font-size:clamp(72px,16vh,150px)}
.b .side{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-bottom:8px;min-width:0}
.b .th{font-size:clamp(18px,3vh,28px);max-width:640px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b .reel{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.b .fr{position:relative;min-height:0;border-radius:6px;overflow:hidden;background:#222;text-align:left;border:1px solid transparent}
.b .fr:hover{border-color:var(--gold)}
.b .fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.b .fr:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,22,15,0) 45%,rgba(18,22,15,.92) 100%)}
.b .fr .cp{position:absolute;left:10px;right:10px;bottom:10px;z-index:1;display:flex;flex-direction:column;gap:2px}
.b .fr .k{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.b .fr b{font-family:var(--disp);font-weight:800;font-size:15px;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.b .fr em{font-style:normal;font-size:11px;color:var(--mut)}
.b .fr.st{display:flex;flex-direction:column;justify-content:space-between;padding:14px;background:#1A2016;border:1px solid var(--gold)}
.b .fr.st:after{display:none}
.b .fr.st p{margin:0;font-family:var(--disp);font-weight:600;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden}
.b .fr.st .k{margin-bottom:8px;display:block}
.b .fr.st .tlink{align-self:flex-start;white-space:nowrap}
@media(max-width:700px){
 .b{padding:14px 16px 12px;gap:12px}
 .b .hd{flex-direction:column;align-items:flex-start;gap:8px}
 .b .yr{font-size:clamp(60px,10vh,84px)}
 .b .side{flex-direction:row;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:0}
 .b .th{font-size:16px;-webkit-line-clamp:2;width:100%;order:2}
 .b .reel{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr)) auto;gap:8px}
 .b .fr.st{grid-column:1 / -1;flex-direction:row;align-items:center;gap:12px;padding:10px 12px}
 .b .fr.st p{-webkit-line-clamp:2;font-size:14px}
 .b .fr.st .k{display:none}
 .b .fr b{font-size:14px}
}
</style></head><body>
<header class="top"></header><main id="app"></main><nav class="strip" aria-label="Year"></nav>
<script src="lab.js"></script>
<script>
LAB.boot(function(M,root){
  var F=M.film,e=LAB.esc,q=F.q,pick=[],lab=[];
  var by={};F.ch.forEach(function(c){by[c.title]=c;});
  var add=function(c,k){if(c&&pick.indexOf(c)<0&&pick.length<6){pick.push(c);lab.push(k);}};
  add(F.open,'Opening');
  var h=by['Heard here first'],s=by['The ones who stayed'],dc=by['Deep cuts']||by['More from the summer'];
  [[h,0],[h,1],[s,0],[s,1],[dc,0],[h,2],[s,2],[dc,1]].forEach(function(p){if(p[0])add(p[0].clips[p[1]],p[0].title);});
  F.ch.forEach(function(c){c.clips.forEach(function(z){add(z,c.title);});});
  var frame=function(c,i){var im=c.photo||c.img;return '<button class="fr" data-i="'+q.indexOf(c)+'" aria-label="Play '+e(LAB.capOf(c))+'"><img loading="lazy" src="'+e(im)+'" alt=""><span class="cp"><span class="k">'+e(lab[i])+'</span><b>'+e(c.a)+'</b><em>Pickathon '+c.fy+'</em></span></button>';};
  root.innerHTML='<section class="b" aria-label="Pickathon '+e(M.label)+'"><div class="hd"><h1 class="yr">'+e(M.label)+'</h1><div class="side"><button class="play">'+LAB.PLAY_ICON+'Play the summer</button>'+(M.th?'<p class="th">'+e(M.th)+'</p>':'')+'</div></div><div class="reel">'+pick.map(frame).join('')+
   '<div class="fr st"><div><span class="k">One story</span><p>'+e(M.line)+'</p></div><button class="tlink rs">Read the story</button></div></div></section>';
  root.querySelector('.play').onclick=function(){LAB.play(q,0,'Pickathon '+M.label);};
  root.querySelectorAll('button.fr').forEach(function(b){b.onclick=function(){LAB.play(q,+b.dataset.i,'Pickathon '+M.label);};});
  root.querySelector('.rs').onclick=function(){LAB.openStory(M);};
});
</script></body></html>
