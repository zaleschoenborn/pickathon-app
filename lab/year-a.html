<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Pickathon Past (TEST)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lab.css">
<style>
.a{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end}
.a .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.a .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,22,15,.1) 0%,rgba(18,22,15,.35) 38%,rgba(18,22,15,.92) 72%,#12160F 100%)}
.a .copy{position:relative;padding:0 32px 18px;display:flex;flex-direction:column;gap:12px;min-height:0}
.a .yr{font-size:clamp(72px,15vh,140px)}
.a .th{font-size:clamp(20px,3.4vh,32px);max-width:820px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a .act{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.a .meta{color:var(--mut);font-size:14px}
.a .chs{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding:16px 32px 18px;border-top:1px solid var(--line);background:rgba(18,22,15,.82)}
.a .ch h2{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:800}
.a .ch .cap{margin:2px 0 10px;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a .ch .head{display:block;width:100%;text-align:left}
.a .ch .chev{display:none}
.a .row{display:flex;gap:8px}
.a .tile{flex:1 1 0;min-width:0;text-align:left}
.a .tile .im{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#222;border:1px solid transparent}
.a .tile:hover .im{border-color:var(--gold)}
.a .tile b{display:block;margin-top:6px;font-size:12.5px;line-height:1.2;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a .tile span{display:block;font-size:11px;color:var(--mut);white-space:nowrap}
.a .tile:nth-child(n+4){display:none}
.a .story .q{margin:0 0 10px;font-family:var(--disp);font-weight:600;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:700px){
 .a .ph{height:60%;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
 .a .shade{background:linear-gradient(180deg,rgba(18,22,15,0) 0%,rgba(18,22,15,.5) 45%,#12160F 66%)}
 .a .copy{padding:0 16px 12px;gap:10px}
 .a .yr{font-size:clamp(64px,11vh,96px)}
 .a .th{font-size:19px}
 .a .chs{grid-template-columns:minmax(0,1fr);gap:0;padding:0 16px 8px;background:#12160F}
 .a .ch{border-top:1px solid var(--line)}
 .a .ch .head{display:flex;align-items:center;justify-content:space-between;min-height:44px}
 .a .ch .cap{display:none}
 .a .ch .chev{display:inline;color:var(--mut);transition:none}
 .a .ch.open .chev{transform:rotate(90deg)}
 .a .ch .body{display:none;padding-bottom:10px}
 .a .ch.open .body{display:block}
 .a .row{overflow-x:auto;scroll-snap-type:x mandatory;margin-right:-16px;padding-right:16px}
 .a .tile{flex:0 0 112px;scroll-snap-align:start}
 .a .tile:nth-child(n+4){display:block}
 .a .story .q{-webkit-line-clamp:3}
}
</style></head><body>
<header class="top"></header><main id="app"></main><nav class="strip" aria-label="Year"></nav>
<script src="lab.js"></script>
<script>
LAB.boot(function(M,root){
  var F=M.film, e=LAB.esc, q=F.q;
  var tile=function(c){return '<button class="tile" data-i="'+q.indexOf(c)+'" aria-label="Play '+e(LAB.capOf(c))+'"><img class="im" loading="lazy" src="'+e(c.img)+'" alt=""><b>'+e(c.a)+'</b><span>Pickathon '+c.fy+'</span></button>';};
  var chs=F.ch.slice(0,3);
  var html='<section class="a" aria-label="Pickathon '+e(M.label)+'">'+(M.hero?'<img class="ph" src="'+e(M.hero)+'" alt="">':'<div class="ph nophoto"></div>')+'<div class="shade"></div>'+
   '<div class="copy"><h1 class="yr">'+e(M.label)+'</h1>'+(M.th?'<p class="th">'+e(M.th)+'</p>':'')+
   '<div class="act"><button class="play">'+LAB.PLAY_ICON+'Play the summer</button><span class="meta">'+(M.count?M.count+' artists':'')+'</span></div></div>'+
   '<div class="chs">'+chs.map(function(c,k){return '<div class="ch'+(k===0?' open':'')+'"><button class="head" aria-expanded="'+(k===0)+'"><span><h2>'+e(c.title)+'</h2><div class="cap">'+e(c.cap)+'</div></span><span class="chev" aria-hidden="true">›</span></button><div class="body"><div class="row">'+c.clips.slice(0,4).map(tile).join('')+'</div></div></div>';}).join('')+
   '<div class="ch story"><button class="head" aria-expanded="false"><span><h2>One story</h2><div class="cap">What happened that summer.</div></span><span class="chev" aria-hidden="true">›</span></button><div class="body"><p class="q">'+e(M.line)+'</p><button class="tlink rs">Read the story</button></div></div></div></section>';
  root.innerHTML=html;
  root.querySelector('.play').onclick=function(){LAB.play(q,0,'Pickathon '+M.label);};
  root.querySelectorAll('.tile').forEach(function(b){b.onclick=function(){LAB.play(q,+b.dataset.i,'Pickathon '+M.label);};});
  root.querySelector('.rs').onclick=function(){LAB.openStory(M);};
  var all=root.querySelectorAll('.ch');
  root.querySelectorAll('.head').forEach(function(h){h.onclick=function(){var p=h.parentNode,was=p.classList.contains('open');all.forEach(function(x){x.classList.remove('open');x.querySelector('.head').setAttribute('aria-expanded','false');});if(!was){p.classList.add('open');h.setAttribute('aria-expanded','true');}};});
});
</script></body></html>
