<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Pickathon Past (TEST)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lab.css">
<style>
.c{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:20px 36px;padding:24px 32px 18px;align-content:start}
.c .stg{position:relative;aspect-ratio:16/9;width:100%;background:#000;border-radius:10px;overflow:hidden}
.c .stg .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c .stg .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,22,15,.1),rgba(18,22,15,.7))}
.c .stg .big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:var(--gold);color:#12160F;display:flex;align-items:center;justify-content:center}
.c .stg .big svg{width:34px;height:34px;fill:currentColor;margin-left:4px}
.c .stg .big:hover{background:#E2C45F}
.c .stg .lp-stage{position:absolute;inset:0;width:100%;aspect-ratio:auto;border-radius:0}
.c .stw{min-width:0}
.c .ctl{display:flex;gap:8px;padding-top:10px;min-height:46px}
.c .ctl button{border:1px solid var(--line);border-radius:999px;min-height:36px;padding:0 14px;font-size:13px;font-weight:700}
.c .ctl button:hover{border-color:var(--gold)}
.c .info{display:flex;flex-direction:column;gap:12px;min-width:0}
.c .yr{font-size:clamp(64px,13vh,120px)}
.c .th{font-size:clamp(18px,2.8vh,26px);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c .now{border-top:1px solid var(--line);padding-top:12px}
.c .now small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.c .now b{font-family:var(--disp);font-weight:800;font-size:20px;line-height:1.2;display:block}
.c .now span{color:var(--mut);font-size:13px}
.c .quote{margin:0;font-size:14px;line-height:1.45;color:var(--mut);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c .act{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.c .tl{grid-column:1 / -1;display:flex;gap:26px;align-items:flex-start;min-width:0}
.c .tl .grp{min-width:0}
.c .tl h2{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:800;white-space:nowrap}
.c .dots{display:flex;gap:6px;flex-wrap:wrap;max-width:330px}
.c .dot{width:76px;height:43px;border-radius:5px;border:2px solid transparent;padding:0;overflow:hidden;background:#222;opacity:.75}
.c .dot img{width:100%;height:100%;object-fit:cover;display:block}
.c .dot:hover{border-color:var(--cream);opacity:1}
.c .dot.on{border-color:var(--gold);opacity:1}
.c .tabs{display:none}
.c .strip2{display:none}
@media(max-width:700px){
 .c{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;gap:12px;padding:0 0 8px;overflow:hidden}
 .c .stg{border-radius:0}
 .c .ctl{padding:8px 16px 0;min-height:0}
 .c .ctl:empty{display:none}
 .c .stg .big{width:68px;height:68px}
 .c .info{padding:0 16px;gap:8px}
 .c .yr{font-size:clamp(56px,9vh,76px)}
 .c .th{font-size:16px;-webkit-line-clamp:2}
 .c .quote{display:none}
 .c .now{padding-top:8px}
 .c .now b{font-size:17px}
 .c .tl{padding:0 16px;flex-direction:column;gap:8px}
 .c .tl .grp{display:none;width:100%}
 .c .tl .grp.on{display:block}
 .c .tabs{display:flex;gap:6px;overflow-x:auto}
 .c .tabs button{flex:none;min-height:38px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:700;color:var(--mut)}
 .c .tabs button.on{border-color:var(--gold);color:var(--cream)}
 .c .dots{max-width:none;flex-wrap:nowrap;overflow-x:auto;gap:8px}
 .c .dot{flex:none;width:84px;height:48px}
 .c .tl h2{display:none}
}
</style></head><body>
<header class="top"></header><main id="app"></main><nav class="strip" aria-label="Year"></nav>
<script src="lab.js"></script>
<script>
LAB.boot(function(M,root){
  var F=M.film,e=LAB.esc,q=F.q,P=null,cur=0;
  var groups=[{title:'Opening',clips:[F.open]}].concat(F.ch);
  var dots=groups.map(function(g,gi){return '<div class="grp'+(gi===0?' on':'')+'" data-g="'+gi+'"><h2>'+e(g.title)+'</h2><div class="dots">'+g.clips.map(function(c){return '<button class="dot" data-i="'+q.indexOf(c)+'" title="'+e(c.a)+'" aria-label="Play '+e(LAB.capOf(c))+'"><img loading="lazy" src="'+e(c.img)+'" alt=""></button>';}).join('')+'</div></div>';}).join('');
  root.innerHTML='<section class="c" aria-label="Pickathon '+e(M.label)+'"><div class="stw"><div class="stg" id="stg"></div><div class="ctl" id="ctl"></div></div><div class="info"><h1 class="yr">'+e(M.label)+'</h1>'+(M.th?'<p class="th">'+e(M.th)+'</p>':'')+
   '<div class="now"><small id="nl">Opens with</small><b id="nb"></b><span id="ns"></span></div>'+(M.line?'<p class="quote">'+e(M.line)+'</p>':'')+
   '<div class="act"><button class="play" id="pb">'+LAB.PLAY_ICON+'Play the summer</button><button class="tlink rs">Read the story</button></div></div>'+
   '<div class="tl"><div class="tabs" role="tablist">'+groups.map(function(g,gi){return '<button role="tab" data-g="'+gi+'" class="'+(gi===0?'on':'')+'">'+e(g.title)+'</button>';}).join('')+'</div>'+dots+'</div></section>';
  var stg=root.querySelector('#stg'),ctl=root.querySelector('#ctl');
  function now(i,live){cur=i;var c=q[i];root.querySelector('#nl').textContent=live?'Now playing':'Opens with';root.querySelector('#nb').textContent=LAB.capOf(c);root.querySelector('#ns').textContent=c.s||'';
    root.querySelectorAll('.dot').forEach(function(d){d.classList.toggle('on',live&&+d.dataset.i===i);});
    if(live){var d=root.querySelector('.dot[data-i="'+i+'"]');if(d){var g=d.closest('.grp');root.querySelectorAll('.grp').forEach(function(x){x.classList.toggle('on',x===g);});root.querySelectorAll('.tabs button').forEach(function(t){t.classList.toggle('on',t.dataset.g===g.dataset.g);});}}}
  function poster(){if(P){P.destroy();P=null;}ctl.innerHTML='';stg.innerHTML=(M.hero?'<img class="ph" src="'+e(M.hero)+'" alt="">':'')+'<div class="shade"></div><button class="big" aria-label="Play the summer">'+LAB.PLAY_ICON+'</button>';stg.querySelector('.big').onclick=function(){start(0);};now(0,false);}
  function start(i){stg.innerHTML='<div class="lp-stage"></div>';ctl.innerHTML='<button class="pv">‹ Back</button><button class="nx">Next ›</button><button class="fs">Full screen</button><button class="cl">Close</button>';
    var st=stg.querySelector('.lp-stage');
    P=new LAB.Player(st,q,i,{onchange:function(k){now(k,true);},onend:poster});
    ctl.querySelector('.pv').onclick=function(){P.prev();};ctl.querySelector('.nx').onclick=function(){P.next();};ctl.querySelector('.cl').onclick=poster;
    ctl.querySelector('.fs').onclick=function(){var f=stg.requestFullscreen||stg.webkitRequestFullscreen;if(f)f.call(stg);};}
  root.querySelector('#pb').onclick=function(){start(0);};
  root.querySelectorAll('.dot').forEach(function(d){d.onclick=function(){start(+d.dataset.i);};});
  root.querySelectorAll('.tabs button').forEach(function(t){t.onclick=function(){root.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===t);});root.querySelectorAll('.grp').forEach(function(g){g.classList.toggle('on',g.dataset.g===t.dataset.g);});};});
  root.querySelector('.rs').onclick=function(){LAB.openStory(M);};
  poster();
});
</script></body></html>
