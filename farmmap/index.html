<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><title>Pendarvis Farm Map</title>
<style>
/* The farm floats on its own paper colour. Shapes are real footprints traced
   from the art, so the same outline is both the glow and the hit area. */
:root{
  --stage:#D4502C; --camp:#C98A14; --around:#3E7F46;
  --wellness:#2E8C9E; --family:#8A4FA8;
  --ink:#12160F; --cream:#F2EDE3; --panel:#161A12; --line:#2B3126; --muted:#AFAB9F;
  --paper:#E3ECD9; --cardh:clamp(250px,34%,340px);
  --f:'Archivo',system-ui,-apple-system,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--cream);font-family:var(--f);
  overscroll-behavior:none}

#stage{position:fixed;top:0;left:0;right:0;bottom:var(--cardh);
  overflow:hidden;touch-action:none;background:var(--paper);cursor:default;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#stage *{-webkit-user-drag:none}
#stage.onhood{cursor:pointer}
#stage.onicon{cursor:pointer}
#itip{position:fixed;z-index:30;pointer-events:none;padding:5px 10px;border-radius:999px;background:#F2B33D;color:#12160F;font:800 12px/1.1 var(--f);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.45);opacity:0;transform:translate(-50%,-140%);transition:opacity .12s}
#itip.on{opacity:1}
#stage.drag,#stage.drag *{cursor:grabbing!important}
#art,#shapes{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#art img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
#tiles{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#tiles img{position:absolute;max-width:none;opacity:0;transition:opacity .22s ease}
#tiles img.on{opacity:1}
#body{touch-action:pan-y}
#nav{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;z-index:3}
#nav button{position:absolute;top:calc(50% - 34px);width:26px;height:68px;border:0;background:rgba(242,237,227,.16);color:var(--cream);font:700 26px/1 var(--f);cursor:pointer;padding:0 0 4px;pointer-events:auto}
#nprev{left:0;border-radius:0 14px 14px 0}#nnext{right:0;border-radius:14px 0 0 14px}
#nav button:active{background:rgba(242,237,227,.3)}
#card.intro{background:var(--cream);border-top-color:#D8D1C2}
#card.intro #nav button{background:rgba(18,22,15,.14);color:var(--ink)}
#card.intro #empty{padding-left:34px;padding-right:34px;padding-top:6px;gap:7px}
#card.intro #empty b{color:var(--ink);font:900 26px/1.05 var(--f);letter-spacing:-.01em}
#card.intro #empty p{color:#3A4132;font-size:15.5px;line-height:1.38}
#card.intro #ibuild{background:#12160F;color:#F2B33D;font-size:14px;padding:13px 18px;margin-top:4px}
@keyframes swl{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes swr{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
#meta.swl{animation:swl .28s ease-out}
#meta.swr{animation:swr .28s ease-out}
#dark{position:absolute;left:-3px;top:-3px;width:calc(100% + 6px)!important;height:calc(100% + 6px)!important;pointer-events:none}
#veil,#lits{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#veil{background:rgba(14,18,10,0);transition:background .25s ease}
#veil.on{background:rgba(14,18,10,.13)}
#stage{transition:background-color .25s ease}
#stage{background-color:#12160F}
#stage.veiled{background-color:#12160F}
#lits img,#lits div{position:absolute;max-width:none;opacity:0;transition:opacity .22s ease}
#lits img.on,#lits div.on{opacity:1}
#shapes{overflow:visible}
/* The highlight is the neighborhood's own ground pattern, turned up: a second
   copy of the art, saturated, showing only inside the area. Black line work and
   white dashes are neutral, so they come through untouched; only the coloured
   dots and ground shift. Badges and amenity icons are holes in the mask, so
   nothing ever paints over a logo. */
/* Invisible but fully hit-testable: pointer-events:fill ignores the paint, so
   the whole area answers the pointer without a wash being drawn on it. */
#hit path{fill:#fff;fill-opacity:0;fill-rule:evenodd;stroke:none;
  pointer-events:fill;cursor:pointer}
#hit .off{pointer-events:auto}
.nohit{display:inline-block;margin-right:8px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--cream);opacity:.8}
.c-stage{color:var(--stage)} .c-camp{color:var(--camp)} .c-around{color:var(--around)}
.c-wellness{color:var(--wellness)} .c-family{color:var(--family)}

#leads{position:absolute;inset:0;pointer-events:none;overflow:visible}
/* Two strokes: a pale one underneath so a line stays legible over dark ground. */
#leads .u{stroke:#FFF;stroke-width:3.2;stroke-opacity:.72}
#leads .o{stroke:currentColor;stroke-width:1.3;stroke-opacity:.95}
#leads .pt{stroke:#FFF;stroke-width:1.6;fill:currentColor}
#labs{position:absolute;inset:0;pointer-events:none}
#leads,#labs{transition:opacity .14s ease}
#stage.moving #leads,#stage.moving #labs{opacity:0}
#stage.moving #labs .lab{pointer-events:none}
.lab{position:absolute;pointer-events:auto;border:0;cursor:pointer;
  padding:4px 8px;border-radius:7px;max-width:116px;
  font:800 11px/1.2 var(--f);letter-spacing:.015em;text-align:left;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);
  display:flex;align-items:center;gap:5px;transform:translateY(-50%)}
.lab span{color:var(--ink)}
.lab{border-left:4px solid currentColor;padding-left:6px;background:color-mix(in srgb,currentColor 16%,#fff)}
.lab::before{content:none}
.lab.r{flex-direction:row-reverse;text-align:right}
.lab[hidden]{display:none}
.lab.sel{background:var(--ink);box-shadow:0 2px 9px rgba(0,0,0,.5)}
.lab.sel span{color:#fff}


#card{position:fixed;left:0;right:0;bottom:0;height:var(--cardh);z-index:30;
  background:var(--panel);border-top:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
#pickbar{display:flex;align-items:center;gap:8px;flex:0 0 auto;
  padding:8px max(13px,env(safe-area-inset-right,0px)) 0 max(13px,env(safe-area-inset-left,0px))}
#ptog{border:1px solid var(--line);background:#222820;color:var(--cream);
  font:700 11px/1 var(--f);padding:7px 10px;border-radius:999px;cursor:pointer;
  min-height:30px;display:flex;align-items:center;gap:5px}
#ptog::after{content:'▾';font-size:9px;opacity:.7}
#ptog[aria-expanded="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
#pnow{font:700 11px/1 var(--f);color:var(--muted)}
/* The key lives in the bar, not in a panel of its own: five dots, read once. */
#key{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
#key b{display:flex;align-items:center;gap:4px;white-space:nowrap}
#key i{width:7px;height:7px;border-radius:999px;background:currentColor;flex:0 0 auto}
#key span{font:700 9.5px/1 var(--f);letter-spacing:.04em;color:var(--muted);
  text-transform:uppercase}
/* On a narrow screen the key drops onto its own line rather than losing its
   words - five unexplained dots are worse than no key at all. */
@media (max-width:620px){
  #pickbar{flex-wrap:wrap;row-gap:7px}
  #key{margin-left:0;width:100%;justify-content:flex-start;gap:9px}
  #key span{font-size:9px}
  #picker{flex-wrap:wrap;overflow:visible;row-gap:6px}
}
#picker{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto;
  padding:8px max(13px,env(safe-area-inset-right,0px)) 8px max(13px,env(safe-area-inset-left,0px))}
#picker::-webkit-scrollbar{display:none}
#picker[hidden]{display:none}
.amb{flex:0 0 auto;border:1px solid var(--line);background:#222820;color:var(--cream);
  font:700 11px/1 var(--f);padding:6px 9px;border-radius:999px;cursor:pointer;
  white-space:nowrap;min-height:30px}
.amb[aria-pressed="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}

/* The picture is the point down here: it runs to the edges of the card and
   takes as much of it as it can, with the words given exactly the room they
   need beside it. */
#body{flex:1 1 auto;min-height:0;display:flex;gap:0;
  padding:9px max(12px,env(safe-area-inset-right,0px))
    calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#hero{flex:0 0 46%;max-width:none;border-radius:12px;overflow:hidden;position:relative;
  background:#0C0F0A;align-self:stretch}
#meta{padding:1px 0 0 12px}
#empty{padding:10px max(13px,env(safe-area-inset-right,0px))
  calc(11px + env(safe-area-inset-bottom,0px)) max(13px,env(safe-area-inset-left,0px))}
#hero[hidden]{display:none}
#hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .7s ease}
#hero img.on{opacity:1}
#hero{background-size:cover;background-position:center}
#meta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.chip{display:inline-flex;align-self:flex-start;font:800 9.5px/1 var(--f);letter-spacing:.1em;
  text-transform:uppercase;padding:5px 8px;border-radius:999px;color:#fff;margin-bottom:5px}
.chip.k-stage{background:var(--stage)} .chip.k-camp{background:var(--camp)}
.chip.k-around{background:var(--around)}
.chip.k-wellness{background:var(--wellness)} .chip.k-family{background:var(--family)}
#cname{margin:0;font-size:19px;font-weight:800;letter-spacing:-.015em;line-height:1.15}
#ctag{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ams{display:flex;flex-wrap:wrap;gap:4px;margin:7px 0 0;overflow:hidden}
.am{font:700 10.5px/1 var(--f);padding:4px 7px;border-radius:5px;background:#222820;
  border:1px solid var(--line);color:var(--muted)}
.am.hit{background:var(--cream);color:var(--ink);border-color:var(--cream)}
#cgo{margin-top:auto;align-self:flex-start;border:0;background:var(--cream);color:var(--ink);
  font:800 12.5px/1 var(--f);padding:10px 14px;border-radius:9px;cursor:pointer;min-height:38px}
#empty{display:flex;flex-direction:column;justify-content:center;gap:5px}
#empty[hidden],#full[hidden],#hero[hidden],#page[hidden],#picker[hidden],
.lab[hidden]{display:none!important}
#empty b{font-size:15px;font-weight:800}
#ibuild{align-self:flex-start;margin-top:6px;padding:9px 14px;border:0;border-radius:999px;background:#F2B33D;color:#12160F;font:800 12px/1 var(--f);cursor:pointer}
#empty p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}

#page{position:fixed;inset:0;z-index:50;background:var(--ink);overflow-y:auto;
  padding:calc(15px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px))
    calc(26px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
#page[hidden]{display:none}
#pgback{border:1px solid var(--line);background:transparent;color:var(--cream);
  font:700 18px/1 var(--f);width:44px;height:44px;padding:0;border-radius:999px;cursor:pointer;display:grid;place-items:center}
#pghero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:13px;margin:15px 0 0;display:block}
#page h1{margin:9px 0 0;font-size:27px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
#page p{margin:6px 0 0;color:var(--muted);font-size:14.5px;line-height:1.55;max-width:62ch}
#page .stub{margin-top:17px;padding-top:13px;border-top:1px solid var(--line);font-size:12.5px}
@media (max-height:640px){:root{--cardh:42%}}
/* Phone card: a bigger picture that plays like a story, bigger words, and a
   button that can never be pushed out of the card. */
@media (max-width:879px){
  :root{--cardh:clamp(250px,36%,340px)}
  #hero{flex:0 0 45%}
  #meta{padding-left:13px}
  #cname{font-size:23px}
  #ctag{font-size:14px;-webkit-line-clamp:3;margin-top:4px}
  .chip{font-size:10px;padding:5px 9px;margin-bottom:6px}
  #full{display:flex;flex-direction:column;height:100%}
  .ams{flex-wrap:nowrap;overflow:hidden;margin-top:8px;
    -webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
  .am{font-size:11px;white-space:nowrap;flex:0 0 auto}
  #cgo{align-self:stretch;margin-top:auto;min-height:46px;font-size:14.5px;border-radius:12px;
    background:#F2B33D;color:#12160F;flex:0 0 auto}
}
@media (max-width:879px) and (max-height:640px){:root{--cardh:clamp(200px,42%,280px)}}
#hero img.on{animation:kb 7s ease-out forwards}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.16)}}
@media (min-width:880px){
  :root{--cardw:400px}
  #stage{bottom:0;right:var(--cardw)}
  #card{top:0;left:auto;width:var(--cardw);height:auto;
    border-top:0;border-left:1px solid var(--line)}
  /* A tall panel reads better with the picture across the top, full width,
     and the words underneath - more image, and the text still gets its room. */
  #body{overflow-y:auto;flex-direction:column;padding:14px 15px
    calc(16px + env(safe-area-inset-bottom,0px))}
  #hero{flex:0 0 auto;width:100%;aspect-ratio:5/4;min-height:0;border-radius:13px}
  #meta{padding:14px 2px 0}
  #cname{font-size:22px} #ctag{-webkit-line-clamp:3;font-size:13.5px}
  #cgo{margin-top:15px}
}

/* Find: the picker is a sheet that rises over the card, never over the map. */
#picker{position:absolute;left:0;right:0;top:46px;bottom:0;z-index:5;background:var(--panel);
  border-top:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;
  padding:10px max(13px,env(safe-area-inset-right,0px)) 14px max(13px,env(safe-area-inset-left,0px))}
#picker[hidden]{display:none}
#pname{font:800 13px/1.2 var(--f);color:var(--cream);margin:0 0 9px;min-height:16px;letter-spacing:.01em}
#pgrid{display:flex;flex-wrap:wrap;gap:7px}
#empty #key{margin:12px 0 0;width:auto;justify-content:flex-start;gap:12px;flex-wrap:wrap}
#empty #key span{font-size:10px}
#ptog.on{background:#F2B33D;color:#12160F;border-color:#F2B33D;padding:3px 8px 3px 4px;gap:7px}
#ptog.on::after{content:none}
#ptog .ic{width:24px;height:24px;border-radius:7px}
#ptog .x{font:800 14px/1 var(--f);padding:4px 5px;margin-left:2px;border-radius:999px;background:rgba(0,0,0,.14)}
#ptog svg.mag{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
#pnow{display:none}
.amb{width:46px;height:46px;min-height:0;padding:0;border:2px solid transparent;border-radius:13px;
  background:none;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.amb[aria-pressed="true"]{background:none;border-color:#F2B33D;box-shadow:0 0 0 2px rgba(242,179,61,.25)}
.amb.all{width:auto;min-width:46px;padding:0 12px;background:#222820;color:var(--cream);font:800 12px/1 var(--f);border-color:var(--line)}
.amb.all[aria-pressed="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.ic{display:block;width:38px;height:38px;border-radius:10px;flex:0 0 auto}
.ic.svg{background:#DDD6AA;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.ic.svg.dark{background:#2A211B}
.ic.svg.blue{background:#7FD3E6}
.ic svg{width:100%;height:100%;display:block;fill:none;stroke:#2A211B;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.dark svg{stroke:#EFE7C9}
.ai{display:inline-flex;flex:0 0 auto;border-radius:8px;opacity:.9}
.ai .ic{width:26px;height:26px;border-radius:7px}
.ai.hit{opacity:1;outline:2px solid #F2B33D;outline-offset:1px}
#ptog{display:flex;align-items:center;gap:6px}
#pnow{font:700 12px/1 var(--f);color:#F2B33D}
#shapes .ring.dot{fill:#F2B33D;stroke:#12160F;stroke-width:1.5px;animation:none}
#shapes .spr{pointer-events:none;overflow:hidden}
#shapes .ring{fill:rgba(242,179,61,.38);stroke:#F2B33D;stroke-width:4px;vector-effect:non-scaling-stroke;pointer-events:none;
  animation:rp 1.5s ease-in-out infinite}
@keyframes rp{0%,100%{opacity:1}50%{opacity:.45}}

/* Find sits on the map, top left, with the neighborhood key under it. Labels keep clear of it. */
#finder{position:fixed;top:max(10px,env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));z-index:25;
  display:flex;flex-direction:column;align-items:flex-start;gap:7px;pointer-events:none}
#finder #ptog{pointer-events:auto;min-height:46px;padding:0 17px 0 13px;gap:9px;border-radius:999px;font:800 15px/1 var(--f);
  background:#161A12;color:var(--cream);border:1px solid rgba(255,255,255,.16);box-shadow:0 3px 12px rgba(0,0,0,.38)}
#finder #ptog::after{content:none}
#finder #ptog svg.mag{width:19px;height:19px;stroke-width:2.6}
#finder #ptog[aria-expanded="true"]{background:var(--cream);color:var(--ink)}
#finder #ptog.on{background:#F2B33D;color:#12160F;border-color:#F2B33D;padding:4px 10px 4px 5px}
#finder #ptog .ic{width:34px;height:34px;border-radius:9px}
#finder #ptog .x{font:800 15px/1 var(--f);padding:5px 7px;border-radius:999px;background:rgba(0,0,0,.14)}
#finder #key{display:none!important;flex-direction:column;gap:5px;margin:0;width:auto;align-items:flex-start;pointer-events:none;
  background:rgba(22,26,18,.80);padding:8px 11px 8px 10px;border-radius:11px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#finder #key b{display:flex;align-items:center;gap:6px}
#finder #key span{font:700 9.5px/1 var(--f);letter-spacing:.05em;color:var(--cream);text-transform:uppercase}
#finder #key i{width:8px;height:8px}
#picker{top:0!important;bottom:0;border-top:0;padding-top:12px}
#phead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px}
#phead #pname{margin:0}
#pclose{border:1px solid var(--line);background:#222820;color:var(--cream);width:34px;height:34px;border-radius:999px;font:800 14px/1 var(--f);cursor:pointer}
#lits img.pk.on,#lits div.pk.on{opacity:.62}   /* the neighborhood under the pointer while another is pinned: same low-layer light, softer */
.lab.peek{outline:3px solid #F2B33D;outline-offset:1px;box-shadow:0 2px 10px rgba(242,179,61,.55)}
#shapes .rr{fill:none;stroke:#F2B33D;stroke-width:4px;vector-effect:non-scaling-stroke;pointer-events:none;filter:drop-shadow(0 0 4px #F2B33D)}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap">

<div id="stage">
  <div id="art"><img id="mapimg" src="map.webp?v=13" alt="Map of Pendarvis Farm" draggable="false"><div id="tiles"></div><div id="veil"></div><div id="lits"></div></div>
  <svg id="shapes"></svg>
  <svg id="leads"></svg>
  <div id="labs"></div>
</div>


<div id="page" hidden>
  <button id="pgback" aria-label="Close and return to the map">✕</button>
  <img id="pghero" alt="">
  <div class="chip" id="pgkind">Stage</div>
  <h1 id="pgname">—</h1>
  <p id="pgtag"></p>
  <div class="ams" id="pgams"></div>
  <p class="stub">Where the real neighborhood page goes — schedule, who built it,
     who played here.</p>
</div>

<div id="finder">
  <button id="ptog" aria-expanded="false" aria-controls="picker"></button>
  <div id="key" aria-label="What the colours mean"></div>
</div>
<div id="card" class="intro">
  <div id="picker" role="group" aria-label="Find on the map" hidden>
    <div id="phead"><div id="pname">What are you looking for?</div><button id="pclose" type="button" aria-label="Close">✕</button></div>

  </div>
  <div id="nav"><button id="nprev" type="button" aria-label="Previous neighborhood">&#8249;</button><button id="nnext" type="button" aria-label="Next neighborhood">&#8250;</button></div>
  <div id="body">
    <div id="hero" hidden></div>
    <div id="meta">
      <div id="empty">
        <b>A city for one weekend</b>
        <p>Every August, architects and builders raise 20 neighborhoods on Pendarvis Farm. Swipe this panel to walk through them, or tap one on the map.</p>
        <button id="ibuild" type="button">We build these. Want one? →</button>
      </div>
      <div id="full" hidden>
        <div class="chip" id="ckind">Stage</div>
        <h2 id="cname">—</h2>
        <p id="ctag"></p>
        <div class="ams" id="cams"></div>
        <button id="cgo">Open the page →</button>
      </div>
    </div>
  </div>

function heroRun(h){
  const box=document.getElementById('hero');
  clearTimeout(heroT); box.innerHTML=''; heroI=0; const tok=heroRun._t=(heroRun._t||0)+1;
  const list=HERO[h.id]||[];
  if(!list.length){ box.hidden=true; return; }
  box.hidden=false;
  // a soft blur of the first photo is there instantly; the photo fades in over it
  box.style.backgroundImage=LQ[h.id]?'url('+LQ[h.id]+')':'none';
  const ims=list.map((src,i)=>{ const im=document.createElement('img'); im.alt=''; im.decoding='async'; box.appendChild(im); return im; });
  const first=ims[0]; first.fetchPriority='high';
  const ready=im=>im.complete&&im.naturalWidth;
  const showFirst=()=>{ if(tok!==heroRun._t) return; void first.offsetWidth; first.classList.add('on');
    // the rest only start loading once the first has arrived, so it never competes
    ims.slice(1).forEach((im,j)=>{ im.src=list[j+1]; });
    if(ims.length>1) heroT=setTimeout(step,3200); };
  first.onload=showFirst; first.src=list[0]; if(ready(first)) showFirst();
  function step(){
    if(tok!==heroRun._t) return;
    const nx=(heroI+1)%ims.length, nim=ims[nx];
    const go=()=>{ if(tok!==heroRun._t) return;
      ims[heroI].classList.remove('on'); heroI=nx; void nim.offsetWidth; nim.classList.add('on');
      heroT=setTimeout(step,3200); };
    if(ready(nim)) go(); else { nim.onload=go; }   // wait for it: never fade to a half-loaded photo
  }
}
// Quietly warm each neighborhood's first photo once the map is up.
function warmHeroes(){

  const ids=HOODS.map(h=>(HERO[h.id]||[])[0]).filter(Boolean); let i=0;
  const next=()=>{ if(i>=ids.length) return; const im=new Image(); im.decoding='async'; im.src=ids[i++]; setTimeout(next,160); };
  setTimeout(next,2500);
}
function show(h){

    document.getElementById('hero').hidden=true;
    document.getElementById('full').hidden=true;

// ---------------------------------------------------------------- gestures
// Rewritten to remove the whole class of bug: there is no remembered "am I
// dragging" state to go stale. Every pointermove asks the EVENT whether a
// button is down and rebuilds the gesture from scratch. A pointerdown that was
// swallowed, a pointerup that never arrived, a finger the browser forgot - none
// of it can jam anything, because nothing is carried forward. A pointer that
// has not reported in for a fifth of a second simply stops existing.
const live=new Map();            // pointerId -> {x,y,t}, rebuilt continuously
let moved=false, pinch=null, tapT=0, lastType='mouse', downAt=null;
const SLOP=10, TAPMS=450;   // a tap is short and barely moves; anything else is a drag
const NOW=()=>(window.performance&&performance.now?performance.now():Date.now());
const GAP=260;                   // silence this long and a pointer is gone

function prune(t){ live.forEach((p,id)=>{ if(t-p.t>GAP) live.delete(id); }); }
function idle(){ clearTimeout(tapT); live.clear(); pinch=null; stage.classList.remove('drag'); }
const down = e => e.pointerType==='mouse' ? (e.buttons&1)===1 : true;

function hover(e){
  if(!stage.contains(e.target)&&e.target!==stage) return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const lb0=el&&el.closest&&el.closest('.lab');
  const h=el&&el.__hood?el.__hood:(lb0&&lb0.__hood?lb0.__hood:null);   // a name tag counts as its neighborhood
  const ia=e.pointerType==='mouse'?iconAt(e):null;
  stage.classList.toggle('onhood',!!h&&!ia); stage.classList.toggle('onicon',!!ia);
  const tp=document.getElementById('itip');
  if(tp){ if(ia){ tp.textContent=TIPLBL[ia]||D.amlbl[ia]||ia; tp.style.left=e.clientX+'px'; tp.style.top=e.clientY+'px'; tp.classList.add('on'); } else tp.classList.remove('on'); }
  if(pinned && e.pointerType==='mouse'){ const lb=el&&el.closest&&el.closest('.lab'); peek(lb&&lb.__hood?lb.__hood:(h&&!ia&&!stage.classList.contains('moving')?h:null)); }
  if(hoverOK && !ia && !pinned && NOW()>settleUntil){
    clearTimeout(hover._t);
    if(h) setCur(h);
    else if(cur) hover._t=setTimeout(()=>{ if(cur && !stage.classList.contains('onhood') && !stage.classList.contains('onicon')) clearCur(); },200);
  }
}

function onMove(e){
  const t=NOW();
  prune(t);
  if(!down(e)){                     // nothing is held: there is no gesture
    if(live.size) idle();
    moved=false;
    if(e.pointerType!=='touch') hover(e);
    return;
  }
  const prev=live.get(e.pointerId);
  live.set(e.pointerId,{x:e.clientX,y:e.clientY,t:t});
  stage.classList.add('drag');
  if(live.size===1){
    pinch=null;
    if(!prev) return;               // first sighting: next move does the work
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    if(!moved&&downAt&&Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>SLOP){ moved=true; }
    if(moved){ tx+=dx; ty+=dy; clamp(); move(); }
  } else if(live.size===2){
    const[a,b]=[...live.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y)||1;
    if(!pinch) pinch={d:d,k:k,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};
    else { moved=true; zoomAt(pinch.k*(d/pinch.d),pinch.cx,pinch.cy); }
  } else {
    idle();                         // three or more is not a gesture here
  }
}

stage.addEventListener('pointerdown',e=>{
  const t=NOW(); prune(t);
  clearTimeout(tapT);
  if(live.size){ pinch=null; moved=true; }   // a second finger: this is a pinch, never a pick
  lastType=e.pointerType;
  if(!live.size){ moved=false; downAt={x:e.clientX,y:e.clientY,t:t}; }   // a press picks nothing
  live.set(e.pointerId,{x:e.clientX,y:e.clientY,t:t});
  stage.classList.add('drag');
});
addEventListener('pointermove',e=>{ try{ onMove(e); }
  catch(err){ idle(); if(++faults<4) console.warn('move',err); } });

// pointermove being delivered at all - the gesture dies mid-stroke and no
// pointerup ever arrives. Neither belongs on a map.
addEventListener('dragstart',e=>e.preventDefault());
addEventListener('selectstart',e=>{ if(stage.contains(e.target)) e.preventDefault(); });

  // An icon answers only once it is big enough to see and aim at (the same zoom where it is drawn as itself). Then any icon, in any neighborhood, answers on the first click.
  if(!(k>=kFit*1.8) || 42*k<22) return null;   // clickable once the icon is at least ~22px across on screen
  if(!_ALLI){ _ALLI=[]; for(const a in ICON_AT) ICON_AT[a].forEach(p=>_ALLI.push([a,p])); }
  const r=stage.getBoundingClientRect(), mx=(e.clientX-r.left-tx)/k, my=(e.clientY-r.top-ty)/k, pad=(e.pointerType==='mouse'?3:10)/k;
  let best=null,bd=1e9;
  _ALLI.forEach(en=>{ const a=en[0],p=en[1], hw=(p[4]||p[2])/2+pad, hh=(p[5]||p[2])/2+pad, dx=Math.abs(p[0]-mx), dy=Math.abs(p[1]-my);
    if(dx<=hw&&dy<=hh){ const d=Math.hypot(dx/hw,dy/hh); if(d<bd){ bd=d; best=a; } } });
  return best;
}
function tapAt(e){
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const h=el&&(el.__hood||(el.closest&&(el.closest('.lab')||{}).__hood));
  // an icon only answers once its neighbourhood is the one already picked
  { const ia=iconAt(e);
    if(ia && window.__setFilter && D.amlbl[ia] && ia!=='tent'){ window.__setFilter(ia,true);
      if(!cur){ const r=stage.getBoundingClientRect(), mx=(e.clientX-r.left-tx)/k, my=(e.clientY-r.top-ty)/k; let bh=null,bd=1e12;
        HOODS.forEach(hh=>{ if(!(hh.amk||[]).includes(ia)||!hh.p) return; const d=Math.hypot(hh.p[0]/100*D.size[0]-mx,hh.p[1]/100*D.size[1]-my); if(d<bd){bd=d;bh=hh;} });
        if(bh){ setCur(bh); pinned=bh; } }
      return; } }
  if(!h){ if((pinned&&e.pointerType==='mouse')||(e.pointerType!=='mouse'&&cur)) clearCur(); return; }
  // mouse: hover peeks, a click pins, a click on the pinned one opens. Touch: the first tap
  // shows the card, a tap on the one already showing opens it.
  if(e.pointerType==='mouse'){ if(pinned!==h){ pinned=h; peek(null); setCur(h); show(h); return; } }
  else if(h!==cur){ setCur(h); return; }

}
const lift=e=>{
  if(e.type==='pointerup' && live.size===1 && live.has(e.pointerId) && !moved && downAt
     && NOW()-downAt.t<=TAPMS && stage.contains(e.target) && e.target!==document.getElementById('pgback')){
    try{ tapAt(e); }catch(err){ if(++faults<4) console.warn('tap',err); }
  }
  live.delete(e.pointerId); if(live.size<2) pinch=null;
                if(!live.size) stage.classList.remove('drag'); };
addEventListener('pointerup',lift,true);
addEventListener('pointercancel',lift,true);
addEventListener('blur',idle);
addEventListener('contextmenu',idle);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) idle(); });

// One click handler for the whole map. The shapes and the labels have none of
// their own, so a drag can never finish by opening a page.
// (taps on the map are resolved on pointer-up, above - a click event can be swallowed)
labs.addEventListener('click',e=>{
  const b=e.target.closest('.lab');
  const h=b&&b.__hood; const wasMoved=moved; moved=false;
  if(!h||wasMoved) return;
  if(e.detail>0) return;   // pointer taps are handled in tapAt, so a label behaves exactly like its neighborhood
  goPage(h);
});
labs.addEventListener('pointerout',e=>{ if(pinned) peek(null); });
labs.addEventListener('pointerover',e=>{
  const b=e.target.closest('.lab');
  if(pinned&&e.pointerType==='mouse'&&b&&b.__hood) peek(b.__hood);
  if(hoverOK&&!pinned&&e.pointerType==='mouse'&&!e.buttons&&b&&b.__hood&&!live.size&&NOW()>settleUntil) setCur(b.__hood);   // hover is for a mouse; a finger only ever picks by tapping
});

// A trackpad two-finger swipe moves the farm; a pinch (which arrives as
// ctrl+wheel) and a mouse wheel zoom it.
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  if(!e.ctrlKey && !e.metaKey && (e.deltaX||Math.abs(e.deltaY)<40)){
    tx-=e.deltaX; ty-=e.deltaY; clamp(); move(); return;
  }
  const s=e.ctrlKey||e.metaKey ? Math.exp(-e.deltaY/140) : (e.deltaY<0?1.2:1/1.2);
  zoomAt(k*s,e.clientX,e.clientY);
},{passive:false});
stage.addEventListener('dblclick',e=>{e.preventDefault(); zoomAt(k*2,e.clientX,e.clientY);});

document.getElementById('cgo').onclick=e=>{ e.stopPropagation(); if(cur) goPage(cur); };
document.getElementById('card').addEventListener('click',e=>{
  if(e.target.closest('#pickbar,#picker,#top,#nav')) return;     // the amenity controls stay controls
  if(window.__swipedAt && performance.now()-window.__swipedAt<500) return;   // the end of a swipe is not a tap
  if(cur) goPage(cur);
});
document.getElementById('pgback').onclick=()=>{document.getElementById('page').hidden=true;};
const PT=document.getElementById('ptog'), PK=document.getElementById('picker');
function setFind(){
  const a=amFilter;
  PT.classList.toggle('on',!!a);
  PT.innerHTML=a?ico(a)+'<span>'+(AMLBL[a]||a)+'</span><span class="x" aria-label="Clear">✕</span>'
    :'<svg class="mag" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6L14 14"/></svg><span>Find</span>';
}
setFind();
PT.onclick=(e)=>{
  if(amFilter && e&&e.target.closest&&e.target.closest('.x')){ const all=document.querySelector('#pgrid .amb.all'); if(all) all.click(); return; }
  const o=PT.getAttribute('aria-expanded')==='true';
  PT.setAttribute('aria-expanded',String(!o)); PK.hidden=o;};
// Arrow keys always move the farm, whatever the pointer is doing.
addEventListener('keydown',e=>{
  const PAN={ArrowLeft:[1,0],ArrowRight:[-1,0],ArrowUp:[0,1],ArrowDown:[0,-1]};
  if(PAN[e.key]){
    e.preventDefault(); idle();
    const s=(e.shiftKey?240:90);
    tx+=PAN[e.key][0]*s; ty+=PAN[e.key][1]*s; clamp(); apply(); return;
  }
  if(e.key==='0'){ fit(); return; }
  if(e.key!=='Escape')return;
  // Escape also wipes the gesture state by hand. If the map ever stops moving
  // and Escape frees it, the fault is in here; if it does not, the fault is
  // somewhere else entirely - which is worth knowing.
  idle(); faults=0; apply();
  const pg=document.getElementById('page');
  if(!pg.hidden){pg.hidden=true;return;}
  clearCur();
});
addEventListener('resize',()=>{const z=k/kFit; fit(); zoomAt(kFit*z,stage.clientWidth/2,stage.clientHeight/2);});

// Coming back from a neighborhood page, the map returns to the same look. Only
// the hand-off saves anything (no running cost); the site clears the flag if the
// visitor goes anywhere else instead of coming back.
// The map remembers where you were - zoom, position, selection - all the time, not
// just at the moment you leave. Only a tab change (handled by the page around it)
// wipes it, so coming back from a neighborhood always lands in the same place.
function saveView(){ try{ const W=stage.clientWidth,H=stage.clientHeight;
  sessionStorage.setItem('pkmap.view',JSON.stringify({kr:k/kFit,cx:(W/2-tx)/k,cy:(H/2-ty)/k,cur:cur&&cur.id,f:amFilter||''})); }catch(e){} }
let saveT=0; function saveSoon(){ clearTimeout(saveT); saveT=setTimeout(saveView,250); }
function restoreView(){ try{
  const v=JSON.parse(sessionStorage.getItem('pkmap.view')||'null');
  const foc=sessionStorage.getItem('pkmap.focus'); sessionStorage.removeItem('pkmap.focus'); const force=sessionStorage.getItem('pkmap.force')==='1'; sessionStorage.removeItem('pkmap.force');
  const W=stage.clientWidth,H=stage.clientHeight;
  const fh=foc&&HOODS.find(x=>x.id===foc);
  if(v){
    k=Math.max(kFit,Math.min(maxK(),kFit*v.kr)); tx=W/2-v.cx*k; ty=H/2-v.cy*k; clamp(); apply();
    const h=fh||HOODS.find(x=>x.id===v.cur);
    if(fh){   // asked to show a neighborhood: keep the look if it is on screen, otherwise bring it in
      const sh=D.shapes[fh.id], bb=sh&&sh.b;
      if(bb){ const x0=tx+bb[0]*k,x1=tx+bb[2]*k,y0=ty+bb[1]*k,y1=ty+bb[3]*k;
        const seen=x1>0&&x0<W&&y1>0&&y0<H&&(Math.min(x1,W)-Math.max(x0,0))*(Math.min(y1,H)-Math.max(y0,0))>0.25*(x1-x0)*(y1-y0);
        if(!seen||force) frameHood(fh); }
    }
    if(v.f&&window.__setFilter) window.__setFilter(v.f,true);
    if(h) setCur(h);
  } else if(fh){ frameHood(fh); setCur(fh); }
}catch(e){} }
function frameHood(fh){ const W=stage.clientWidth,H=stage.clientHeight, sh=D.shapes[fh.id], bb=sh&&sh.b;
  if(!bb) return; const bw=Math.max(80,bb[2]-bb[0]), bh=Math.max(80,bb[3]-bb[1]);
  k=Math.max(kFit,Math.min(maxK(),Math.min(W*0.5/bw,H*0.5/bh)));
  tx=W/2-((bb[0]+bb[2])/2)*k; ty=H/2-((bb[1]+bb[3])/2)*k; clamp(); apply(); }
let settleUntil=0; let hoverOK=true;   // hover previews only until the first pan, zoom or click; after that a click selects and a second click opens

document.getElementById('ibuild').addEventListener('click',()=>{ try{ parent.postMessage({pkMap:'go',r:'build'},'*'); }catch(e){} });
function boot(){ if(!document.getElementById('itip')){ const t=document.createElement('div'); t.id='itip'; document.body.appendChild(t); } art.style.width=MW+'px'; art.style.height=MH+'px'; build(); fit(); restoreView(); settleUntil=NOW()+900; warmHeroes(); }
if(img.complete&&img.naturalWidth) boot(); else img.onload=boot;

// ---- Walk the farm: swipe the card (or use the arrows) to go neighbourhood to
// neighbourhood, and the map glides to frame each one. The order is a walk from
// the far south lots up through the camps; the big camps frame the whole farm.
const ORDER=['welcomelot','willowcamp','southcamp','curation','farmhouse','orchard','courtyard','lucky','galaxy','paddock','windmill','grove','market','cherryhill','coyote','refuge','quailtrail','woods','lushcamp','wildcamp'];
let flyRaf=0;
function viewFor(h){
  const sh=D.shapes[h.id], W=stage.clientWidth, H=stage.clientHeight; if(!sh) return null;
  const b=sh.b, bw=b[2]-b[0], bh=b[3]-b[1];
  const nk=Math.max(kFit,Math.min(maxK(),W*0.74/bw,H*0.74/bh));
  const cx=(b[0]+b[2])/2, cy=(b[1]+b[3])/2, w=MW*nk, h2=MH*nk;
  let ntx=W/2-cx*nk, nty=H/2-cy*nk;
  ntx = w<=W ? (W-w)/2 : Math.min(0,Math.max(W-w,ntx));
  nty = h2<=H ? (H-h2)/2 : Math.min(0,Math.max(H-h2,nty));
  return {k:nk,tx:ntx,ty:nty};
}
// Start fetching what the destination needs while the glide is still under way,
// so the sharp pieces are there when it lands rather than popping in after.
function warmView(to,h){
  try{
    const W=stage.clientWidth,H=stage.clientHeight; if(to.k*Math.min(window.devicePixelRatio||1,3)<1.05) return;
    const m=TM*0.2, x0=Math.max(0,-to.tx/to.k-m), y0=Math.max(0,-to.ty/to.k-m), x1=Math.min(MW,(W-to.tx)/to.k+m), y1=Math.min(MH,(H-to.ty)/to.k+m);
    for(let c=Math.floor(x0/TM);c<=Math.min(TW-1,Math.floor(x1/TM));c++) for(let r=Math.floor(y0/TM);r<=Math.min(TH-1,Math.floor(y1/TM));r++) new Image().src='t/'+c+'_'+r+'.webp?v=13';
    if(LIT[h.id]&&LIT[h.id].a){ new Image().src='l/'+h.id+'_a.webp?v=13'; }
  }catch(e){}
}
function flyTo(h){
  const to=viewFor(h); if(!to) return;
  warmView(to,h);
  cancelAnimationFrame(flyRaf);
  const W=stage.clientWidth, H=stage.clientHeight;
  const c0={x:(W/2-tx)/k,y:(H/2-ty)/k,k:k}, c1={x:(W/2-to.tx)/to.k,y:(H/2-to.ty)/to.k,k:to.k};
  const dist=Math.hypot(c1.x-c0.x,c1.y-c0.y)*Math.min(c0.k,c1.k);
  // a short hop just glides; a long one pulls back a little on the way, so you
  // see the farm go by and arrive, instead of sliding across a blur
  const dip = dist>170 ? Math.min(0.55,0.12+dist/2600) : 0;
  const dur=Math.min(900,430+Math.min(dist,900)*0.28+Math.abs(Math.log(c1.k/c0.k))*110);
  const t0=performance.now(); stage.classList.add('moving');
  (function step(now){
    const p=Math.min(1,(now-t0)/dur), e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
    k=Math.max(kFit,Math.exp(Math.log(c0.k)+(Math.log(c1.k)-Math.log(c0.k))*e-dip*Math.sin(Math.PI*e)));
    const cx=c0.x+(c1.x-c0.x)*e, cy=c0.y+(c1.y-c0.y)*e;
    tx=W/2-cx*k; ty=H/2-cy*k; paint();
    if(p<1) flyRaf=requestAnimationFrame(step);
    else { k=to.k; tx=to.tx; ty=to.ty; clamp(); paint(); stage.classList.remove('moving'); apply(); }
  })(t0);
}
function stepHood(dir){
  let i=cur?ORDER.indexOf(cur.id):-1;
  if(i<0) i=dir>0?-1:0;
  for(let n=0;n<ORDER.length;n++){
    i=(i+dir+ORDER.length)%ORDER.length;
    const h=HOODS.find(x=>x.id===ORDER[i]);
    if(h && passes(h)){
      const m=document.getElementById('meta'); m.classList.remove('swl','swr'); void m.offsetWidth; m.classList.add(dir>0?'swl':'swr');
      setCur(h); pinned=h; flyTo(h); return;
    }
  }
}
(function(){
  const card=document.getElementById('card'); let d=null;
  document.getElementById('nprev').onclick=()=>stepHood(-1);
  document.getElementById('nnext').onclick=()=>stepHood(1);
  card.addEventListener('pointerdown',e=>{ d=(e.target.closest('#cams,#picker,button'))?null:{x:e.clientX,y:e.clientY,t:performance.now()}; });
  card.addEventListener('pointerup',e=>{
    if(!d) return; const dx=e.clientX-d.x, dy=e.clientY-d.y, dt=performance.now()-d.t; d=null;
    if(Math.abs(dx)>46 && Math.abs(dx)>1.6*Math.abs(dy) && dt<800){ window.__swipedAt=performance.now(); stepHood(dx<0?1:-1); }
  });
  card.addEventListener('pointercancel',()=>{ d=null; });
  stage.addEventListener('pointerdown',()=>cancelAnimationFrame(flyRaf),true);
  addEventListener('keydown',e=>{ if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if(e.key==='ArrowRight') stepHood(1); else if(e.key==='ArrowLeft') stepHood(-1); });
})();
