<style id="pk-hm-css">
/* Neighborhood page: "Where it is" map (Zale, Nov 9 08:30: a way to move between neighborhoods from the map on each neighborhood page). Design Studio */
#root .pk-hm{margin:18px 0 6px;max-width:760px}
#root .pk-hm-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 10px}
#root .pk-hm-h p{margin:0;font:800 12px/1.2 'Bricolage Grotesque',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#9FCB8A}
#root .pk-hm-h span{display:block;margin-top:4px;font-size:14px;letter-spacing:0;text-transform:none;font-weight:600;color:#CFC9BC}
#root#root#root .pk-hm-full{flex:none;min-height:44px;padding:0 14px;border-radius:6px;border:2px solid #D6B54A!important;background:transparent!important;color:#F2CF62!important;font:800 13px 'Bricolage Grotesque',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
#root .pk-hm-m{isolation:isolate;position:relative;height:230px;border-radius:14px;overflow:hidden;background:#12160F;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
@media (min-width:700px){#root .pk-hm-m{height:300px}}
#root .pk-hm-m.drag{cursor:grabbing}
#root .pk-hm-m::after{content:'';position:absolute;inset:0;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}
#root .pk-hm-l{position:absolute;left:0;top:0;background:url(farmmap/map.webp) 0 0/100% 100% no-repeat;transform-origin:0 0}
#root .pk-hm-lit{position:absolute;max-width:none;pointer-events:none;filter:drop-shadow(0 0 2px #fff4c2) drop-shadow(0 0 14px rgba(255,205,90,.9)) brightness(1.12) saturate(1.2)}
#root .pk-hm.anim .pk-hm-l,#root .pk-hm.anim .pk-hm-s{transition:transform .5s cubic-bezier(.45,0,.25,1),left .5s cubic-bezier(.45,0,.25,1),top .5s cubic-bezier(.45,0,.25,1)}
#root#root#root#root#root .pk-hm-s{position:absolute;width:44px;height:44px;min-height:0!important;margin:-22px 0 0 -22px;padding:0!important;border:0!important;border-radius:50%!important;background:transparent!important;box-shadow:none!important;cursor:pointer;z-index:2}
#root .pk-hm-s i{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:center/100% no-repeat;box-shadow:0 0 0 2px rgba(242,237,227,.9);filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
#root .pk-hm-s b{position:absolute;left:50%;top:40px;transform:translateX(-50%);white-space:nowrap;padding:2px 7px;border-radius:4px;background:rgba(31,28,29,.9);color:#F2EDE3;font:800 11px/1.2 'Bricolage Grotesque',sans-serif;letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
#root .pk-hm-s.here{cursor:default;z-index:5}
#root .pk-hm-s.here i{width:44px;height:44px;margin:-22px 0 0 -22px;box-shadow:0 0 0 3px #F2CF62,0 0 0 6px rgba(31,28,29,.55),0 0 30px 14px rgba(242,207,98,.8);filter:none}
#root .pk-hm-s.here b{top:48px;background:#F2CF62;color:#1F1C1D;font-size:12px}
#root#root .pk-hm-s:focus-visible{outline:2px solid #F2CF62;outline-offset:2px}
#root .pk-hm-zm{position:absolute;right:8px;top:8px;z-index:9;display:flex;gap:6px}
#root .pk-hm-s.nz b,#root .pk-hm-s.lh b,#root .pk-hm.own .pk-hm-s:not(.here) b{opacity:0}
#root#root#root#root#root .pk-hm-zm button{width:44px;height:44px;min-height:44px!important;padding:0;border-radius:8px!important;border:1.5px solid rgba(242,237,227,.5)!important;background:rgba(31,28,29,.88)!important;color:#F2EDE3;display:grid;place-items:center;cursor:pointer}
#root .pk-hm-zm svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
#root#root .pk-hm-zm button:disabled{opacity:.35;cursor:default}
@media (prefers-reduced-motion:reduce){#root .pk-hm.anim .pk-hm-l,#root .pk-hm.anim .pk-hm-s{transition:none}}
</style>
<script id="pk-hm-js">

      b.classList.remove('lh'); var lb = b.querySelector('b'), ib = b.querySelector('i').getBoundingClientRect(), r = lb.getBoundingClientRect();
      var hit = boxes.some(function (q) { return !(r.right < q.left || r.left > q.right || r.bottom < q.top || r.top > q.bottom); }) || b.classList.contains('nz');
      if (hit) b.classList.add('lh'); else boxes.push(r); boxes.push(ib); });

  }

    var h = '<div class="pk-hm-h"><p>Where it is<span>' + (window.matchMedia && matchMedia('(pointer:fine)').matches ? 'Click a neighbor to go there. Drag to look around.' : 'Tap a neighbor to go there. Drag or pinch to look around.') + '</span></p><button type="button" class="pk-hm-full">Full map →</button></div><div class="pk-hm-m" role="group" aria-label="The farm map around ' + nm(id) + '"><div class="pk-hm-l"></div>';
    Object.keys(P).forEach(function (k) { var here = k === id; h += '<button type="button" class="pk-hm-s' + (here ? ' here' : '') + '" data-h="' + k + '" aria-label="' + (here ? nm(k) + ', you are here' : 'Go to ' + nm(k)) + '"' + (here ? ' aria-current="page"' : '') + '><i style="background-image:url(ic2/' + k + '.png)"></i><b>' + nm(k) + '</b></button>'; });

    w.innerHTML = h; host.parentNode.insertBefore(w, host.nextSibling);
    var LO = (window.__pkCyLO || {})[id], m0 = w.querySelector('.pk-hm-m'), s0 = Math.min(m0.clientWidth || 340, 480) / 760; if (LO) { var im = document.createElement('img'); im.className = 'pk-hm-lit'; im.alt = ''; im.src = 'farmmap/l/' + id + '.webp?v=33'; im.style.cssText = 'left:' + (LO[0] * s0).toFixed(1) + 'px;top:' + (LO[1] * s0).toFixed(1) + 'px;width:' + (LO[2] * s0).toFixed(1) + 'px;height:' + (LO[3] * s0).toFixed(1) + 'px'; w.querySelector('.pk-hm-l').appendChild(im); }
    var m = w.querySelector('.pk-hm-m'), vw = m.clientWidth || 340, vh = m.clientHeight || 230, s = Math.min(vw, 480) / 760;   /* never blown up past the art's own size */
    if (VS[id] && VS[id].vw === vw) V = VS[id];
    else {

      var near = Object.keys(P).filter(function (k) { return k !== id; }).map(function (k) { return [k, Math.hypot(P[k][0] - P[id][0], P[k][1] - P[id][1])]; }).sort(function (a, b) { return a[1] - b[1]; });
      var zmin = Math.min(1, vw / (MW * s), vh / (MH * s)), floor = 0.3 / s;
      var frameFor = function (n) { var pts = [P[id]].concat(near.slice(0, n).map(function (q) { return P[q[0]]; })), x0 = Math.min.apply(null, pts.map(function (p) { return p[0]; })), x1 = Math.max.apply(null, pts.map(function (p) { return p[0]; })), y0 = Math.min.apply(null, pts.map(function (p) { return p[1]; })), y1 = Math.max.apply(null, pts.map(function (p) { return p[1]; }));

      var hx = P[id][0] * s * z + V.tx, hy = P[id][1] * s * z + V.ty; if (hx < 70) V.tx += 70 - hx; if (hx > vw - 70) V.tx -= hx - (vw - 70); if (hy < 50) V.ty += 50 - hy; if (hy > vh - 60) V.ty -= hy - (vh - 60);   /* this neighborhood always sits well inside the frame */

  });
