<style id="pk-cy-css">
/* pk-city: Home "Live inside a temporary city of wonder" on every screen: the picked neighborhood's photo beside a strip of the real farm map (home_flow.md section 3; Zale, Nov 9: "I wanna see the new map come on") */
#root #pk-nh-city.pk-cyon #pk-nh-cr,#root #pk-nh-city.pk-cyon .pk-nh-arrs{display:none!important}
/* phone and tablet (Zale, Nov 9 06:30): the same photo and real map, stacked; the map pans to the picked spot */
#root .pk-cy.ph{grid-template-columns:minmax(0,1fr)!important;gap:12px;margin-top:14px}
#root .pk-cy.ph .pk-cy-m{width:100%!important}
#root .pk-cy-l{position:absolute;left:0;top:0;background:no-repeat;transition:transform .6s cubic-bezier(.45,0,.25,1)}
#root .pk-cy.ph .pk-nh-cl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#root#root .pk-cy-all.ph{position:absolute;right:10px;top:10px;z-index:5;margin:0;min-height:44px;padding:0 12px;font-size:12px;background:rgba(31,28,29,.88);backdrop-filter:blur(2px)}
@media (prefers-reduced-motion:reduce){#root .pk-cy-l{transition:none}}
@media (hover:none){#root .pk-cy-s:hover b{opacity:0}#root .pk-cy-s.on:hover b{opacity:1}}
#root .pk-cy{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;margin-top:18px}
#root .pk-cy-f{position:relative;height:573px;border-radius:16px;overflow:hidden;cursor:pointer;background:#1A2017}
#root .pk-cy-f>article{position:absolute!important;inset:0!important;width:auto!important;height:auto!important;margin:0!important;border-radius:0!important}
#root .pk-cy-f>article .pk-nh-hit{pointer-events:none}
#root .pk-cy-f:focus-visible{outline:3px solid #F2CF62;outline-offset:3px}
#root .pk-cy-m{position:relative;width:420px;height:573px;border-radius:16px;overflow:hidden;background:#12160F no-repeat}
#root .pk-cy-m::after{content:'';position:absolute;inset:0;border-radius:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}
#root#root#root .pk-cy-s{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0!important;background:transparent!important;box-shadow:none!important;outline-offset:2px;min-height:0;cursor:default;z-index:1}
#root .pk-cy-s i{position:absolute;left:8px;top:8px;width:28px;height:28px;border-radius:50%;box-sizing:border-box;background:transparent center/28px no-repeat;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
#root .pk-cy-s.on{z-index:3}
#root .pk-cy-s.on i{width:36px;height:36px;left:4px;top:4px;background-size:36px;filter:none;box-shadow:0 0 0 3px #D6B54A,0 0 18px 4px rgba(214,181,74,.5)}
#root .pk-cy-s b{position:absolute;left:50%;top:40px;transform:translateX(-50%);white-space:nowrap;padding:3px 8px;border-radius:4px;background:#1F1C1D;color:#F2EDE3;font:800 12px/1.1 'Bricolage Grotesque',sans-serif;font-stretch:75%;font-variation-settings:'wdth' 75;letter-spacing:.08em;text-transform:uppercase;opacity:0;pointer-events:none;transition:opacity .15s}
#root .pk-cy-s.on b{opacity:1;background:#D6B54A;color:#2B2628}
#root .pk-cy-s:hover b,#root .pk-cy-s:focus-visible b{opacity:1}
#root .pk-cy-s:hover{z-index:4}
#root .pk-cy-s.ed-r b{left:auto;right:4px;transform:none}#root .pk-cy-s.ed-l b{left:4px;transform:none}#root .pk-cy-s.ed-b b{top:auto;bottom:40px}
#root#root .pk-cy-all{margin-left:auto;align-self:flex-end;flex:none;min-height:44px;padding:0 16px;border-radius:6px;cursor:pointer;background:transparent;border:2px solid #D6B54A;color:#F2CF62;font:800 13px 'Bricolage Grotesque',sans-serif;letter-spacing:1.2px;text-transform:uppercase;white-space:nowrap}
</style>
<script id="pk-cy-js">

  var W0 = 420, X0 = 330, Y0 = 1150, MW = 2041, MH = 3810, S0 = W0 / (MW - X0), H0 = Math.round((MH - Y0) * S0), W = W0, S = S0, H = H0;
  var st = { pick: null, sig: '' };
  function cards(sec) { return [].filter.call(sec.querySelectorAll('#pk-nh-cr > article'), function (a) { return !a.classList.contains('cn') && !a.classList.contains('all') && a.querySelector('.pk-nh-cn'); }); }
  function idOf(a) { var n = (a.querySelector('.pk-nh-cn') || {}).textContent || ''; return NM[n.trim().toLowerCase()] || null; }
  function spread(L) { // nudge close spots apart so none overlap (Galaxy Barn, Courtyard, Orchard, Lucky, Farmhouse)
    for (var it = 0; it < 40; it++) for (var i = 0; i < L.length; i++) for (var j = i + 1; j < L.length; j++) { var a = L[i], b = L[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, m = 38; if (d < m) { var p = (m - d) / 2, ux = dx / d, uy = dy / d; a.x -= ux * p; a.y -= uy * p; b.x += ux * p; b.y += uy * p; } }
    L.forEach(function (q) { q.x = Math.max(18, Math.min(W - 18, q.x)); q.y = Math.max(18, Math.min(H - 18, q.y)); }); return L; }
  var PH = { on: false, Hf: 300, Vh: 240 };
  function sizeForPh(sec) { var w = (sec.querySelector('.pk-nh-head') || sec).clientWidth || 358; PH.w = w; W = Math.max(280, Math.min(w, 560)); S = W / (MW - X0); H = Math.round((MH - Y0) * S);
    var hd = sec.querySelector('.pk-nh-head'), hb = hd ? hd.getBoundingClientRect().bottom - sec.getBoundingClientRect().top : 120, bar = document.querySelector('.pk-tabbar, nav[aria-label="Main"]'), tb = window.innerWidth < 1000 ? 64 : 0, vis = (window.innerHeight || 800) - 76 - tb - hb - 14 - 12, av = Math.max(400, Math.min(vis, window.innerWidth < 700 ? 600 : 900));
    PH.Hf = Math.round(av * 0.54); PH.Vh = av - PH.Hf - 12; }
  function sizeFor() { var hmax = Math.max(440, (window.innerHeight || 900) - 250); if (H0 > hmax) { H = Math.round(hmax); S = H / (MH - Y0); W = Math.round((MW - X0) * S); } else { W = W0; S = S0; H = H0; } }
  function build(sec) {

    [].forEach.call(sec.querySelectorAll('.pk-cy-all'), function (x) { x.remove(); });

    if (!st.pick || ids.indexOf(st.pick) < 0) st.pick = ids.filter(Boolean)[0];
    var L = spread(ids.map(function (id, i) { return id && P[id] ? { id: id, i: i, x: (P[id][0] - X0) * S, y: (P[id][1] - Y0) * S, n: (A[i].querySelector('.pk-nh-cn') || {}).textContent || id } : null; }).filter(Boolean));
    var bg = 'background-image:url(farmmap/map.webp);background-size:' + (MW * S).toFixed(1) + 'px auto;background-position:' + (-X0 * S).toFixed(1) + 'px ' + (-Y0 * S).toFixed(1) + 'px;';
    var h = PH.on ? '<div class="pk-cy-f" role="link" tabindex="0" style="height:' + PH.Hf + 'px"></div><div class="pk-cy-m" role="group" aria-label="The neighborhoods on the farm map" style="height:' + PH.Vh + 'px"><div class="pk-cy-l" style="' + bg + 'height:' + H + 'px;width:' + W + 'px;left:' + Math.max(0, Math.round((PH.w - W) / 2)) + 'px">'
      : '<div class="pk-cy-f" role="link" tabindex="0" style="height:' + H + 'px"></div><div class="pk-cy-m" role="group" aria-label="The neighborhoods on the farm map" style="' + bg + 'height:' + H + 'px">';
    L.forEach(function (q) { h += '<button type="button" class="pk-cy-s' + (q.id === st.pick ? ' on' : '') + (q.x > W - 70 ? ' ed-r' : q.x < 70 ? ' ed-l' : '') + (q.y > H - 50 ? ' ed-b' : '') + '" data-cy="' + q.id + '" aria-pressed="' + (q.id === st.pick) + '" aria-label="' + q.n.replace(/"/g, '') + '" style="left:' + q.x.toFixed(1) + 'px;top:' + q.y.toFixed(1) + 'px"><i style="background-image:url(ic2/' + q.id + '.png)"></i><b>' + q.n + '</b></button>'; });
    h += PH.on ? '</div></div>' : '</div>'; box.innerHTML = h; box.classList.toggle('ph', PH.on); var mm = box.querySelector('.pk-cy-m');
    if (PH.on) { box.style.gridTemplateColumns = ''; } else { box.style.gridTemplateColumns = 'minmax(0,1fr) ' + W + 'px'; if (mm) mm.style.width = W + 'px'; }
    var all = [].filter.call(sec.querySelectorAll('#pk-nh-cr > article.all'), function (a) { return /map/i.test(a.textContent); })[0];
    if (all) { var b = document.createElement('button'); b.type = 'button'; b.className = 'pk-cy-all' + (PH.on ? ' ph' : ''); b.textContent = ((all.querySelector('.pk-nh-an') || {}).textContent || 'All on the map').trim() + ' →'; b.addEventListener('click', function () { var hh = all.querySelector('.pk-nh-hit'); if (hh) hh.click(); }); if (PH.on && mm) mm.appendChild(b); else sec.querySelector('.pk-nh-head').appendChild(b); }
    sec.classList.add('pk-cyon'); show(sec, true);
  }
  function show(sec, now) {

    var c = a.cloneNode(true); c.removeAttribute('role'); [].forEach.call(c.querySelectorAll('button,a,[tabindex]'), function (x) { x.setAttribute('tabindex', '-1'); x.setAttribute('aria-hidden', 'true'); }); f.innerHTML = ''; f.appendChild(c); f.setAttribute('aria-label', ((a.querySelector('.pk-nh-cn') || {}).textContent || '') + ': explore it on the map');
    sec.querySelectorAll('.pk-cy-s').forEach(function (s) { var on = s.getAttribute('data-cy') === st.pick; s.classList.toggle('on', on); s.setAttribute('aria-pressed', String(on)); });
    var l = sec.querySelector('.pk-cy-l'), on = sec.querySelector('.pk-cy-s.on');
    if (l && on) { var y = parseFloat(on.style.top) || 0, ty = Math.max(Math.min(0, PH.Vh / 2 - y), PH.Vh - (parseFloat(l.style.height) || PH.Vh)); if (now) { l.style.transition = 'none'; l.style.transform = 'translateY(' + ty.toFixed(1) + 'px)'; l.offsetHeight; l.style.transition = ''; } else l.style.transform = 'translateY(' + ty.toFixed(1) + 'px)'; }
  }
  function step(sec, d) { var ids = cards(sec).map(idOf).filter(Boolean), i = ids.indexOf(st.pick); st.pick = ids[(i + d + ids.length) % ids.length]; show(sec); }
  document.addEventListener('click', function (e) {
    var s = e.target.closest && e.target.closest('.pk-cy-s'); var sec = document.getElementById('pk-nh-city');
    if (s && sec && sec.contains(s)) { st.pick = s.getAttribute('data-cy'); show(sec); return; }
    var f = e.target.closest && e.target.closest('.pk-cy-f');
    if (f && sec && sec.contains(f) && Date.now() - (window.pkCySwiped || 0) < 500) return;
    if (f && sec && sec.contains(f)) { var a = cards(sec).filter(function (x) { return idOf(x) === st.pick; })[0]; var hit = a && a.querySelector('.pk-nh-hit'); if (hit) hit.click(); }
  });
  var sw = null;
  document.addEventListener('touchstart', function (e) { var f = e.target.closest && e.target.closest('#pk-nh-city .pk-cy-f'); sw = f ? { x: e.touches[0].clientX, y: e.touches[0].clientY, moved: false } : null; }, { passive: true });
  document.addEventListener('touchmove', function (e) { if (sw && Math.abs(e.touches[0].clientX - sw.x) > 10) sw.moved = true; }, { passive: true });
